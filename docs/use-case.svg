<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 700" font-family="Segoe UI, Arial, sans-serif" font-size="15">
  <!-- Диаграмма прецедентов интерфейса React (ЛР6) -->
  <rect width="920" height="700" fill="#ffffff"/>
  <defs>
    <marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M1 1 L11 6 L1 11 Z" fill="#ffffff" stroke="#333" stroke-width="1"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#555" stroke-width="1.3"/>
    </marker>
  </defs>

  <!-- Граница системы -->
  <rect x="230" y="20" width="660" height="660" rx="6" fill="#f7f9fc" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="560" y="46" text-anchor="middle" font-weight="600" fill="#2b4a78">SPA «Кометы» (React)</text>

  <!-- Актёр: Гость -->
  <g stroke="#333" stroke-width="2" fill="none">
    <circle cx="100" cy="150" r="16"/>
    <line x1="100" y1="166" x2="100" y2="210"/>
    <line x1="72" y1="182" x2="128" y2="182"/>
    <line x1="100" y1="210" x2="78" y2="245"/>
    <line x1="100" y1="210" x2="122" y2="245"/>
  </g>
  <text x="100" y="270" text-anchor="middle" font-weight="600">Гость</text>

  <!-- Актёр: Пользователь -->
  <g stroke="#333" stroke-width="2" fill="none">
    <circle cx="100" cy="420" r="16"/>
    <line x1="100" y1="436" x2="100" y2="480"/>
    <line x1="72" y1="452" x2="128" y2="452"/>
    <line x1="100" y1="480" x2="78" y2="515"/>
    <line x1="100" y1="480" x2="122" y2="515"/>
  </g>
  <text x="100" y="540" text-anchor="middle" font-weight="600">Пользователь</text>
  <text x="100" y="558" text-anchor="middle" font-size="12" fill="#666">(после входа, JWT)</text>

  <!-- Обобщение: пользователь — разновидность гостя -->
  <line x1="100" y1="398" x2="100" y2="282" stroke="#333" stroke-width="1.5" marker-end="url(#tri)"/>

  <!-- Прецеденты гостя -->
  <g fill="#e8f0fb" stroke="#4a6fa5" stroke-width="1.5">
    <ellipse cx="400" cy="95" rx="125" ry="26"/>
    <ellipse cx="400" cy="160" rx="125" ry="26"/>
    <ellipse cx="400" cy="225" rx="125" ry="26"/>
    <ellipse cx="400" cy="290" rx="125" ry="26"/>
    <ellipse cx="400" cy="355" rx="125" ry="26"/>
  </g>
  <g text-anchor="middle">
    <text x="400" y="100">Смотреть главную</text>
    <text x="400" y="165">Смотреть ленту комет</text>
    <text x="400" y="230">Смотреть плитку комет</text>
    <text x="400" y="295">Фильтровать по периоду</text>
    <text x="400" y="360">Войти</text>
  </g>

  <!-- Прецеденты пользователя -->
  <g fill="#fdf1dc" stroke="#c98a1a" stroke-width="1.5">
    <ellipse cx="400" cy="425" rx="125" ry="26"/>
    <ellipse cx="400" cy="490" rx="125" ry="26"/>
    <ellipse cx="400" cy="555" rx="125" ry="26"/>
    <ellipse cx="400" cy="620" rx="125" ry="26"/>
  </g>
  <g text-anchor="middle">
    <text x="400" y="430">Поставить / снять лайк</text>
    <text x="400" y="495">Добавить комету</text>
    <text x="400" y="560">Удалить свою комету</text>
    <text x="400" y="625">Выйти</text>
  </g>

  <!-- Расширения -->
  <g fill="#eef6ee" stroke="#4f8a4f" stroke-width="1.5">
    <ellipse cx="700" cy="160" rx="108" ry="34"/>
    <ellipse cx="700" cy="290" rx="108" ry="26"/>
    <ellipse cx="700" cy="490" rx="108" ry="34"/>
  </g>
  <g text-anchor="middle" font-size="14">
    <text x="700" y="155">Показать mock-данные</text>
    <text x="700" y="173" font-size="12" fill="#555">(веб-сервис недоступен)</text>
    <text x="700" y="295">Сбросить фильтр</text>
    <text x="700" y="485">Загрузить фото и видео</text>
    <text x="700" y="503" font-size="12" fill="#555">в Minio</text>
  </g>

  <!-- Ассоциации актёров -->
  <g stroke="#333" stroke-width="1.2">
    <line x1="128" y1="182" x2="276" y2="98"/>
    <line x1="128" y1="182" x2="276" y2="160"/>
    <line x1="128" y1="182" x2="276" y2="222"/>
    <line x1="128" y1="182" x2="279" y2="284"/>
    <line x1="128" y1="182" x2="284" y2="345"/>
    <line x1="128" y1="452" x2="275" y2="425"/>
    <line x1="128" y1="452" x2="278" y2="484"/>
    <line x1="128" y1="452" x2="284" y2="545"/>
    <line x1="128" y1="452" x2="290" y2="606"/>
  </g>

  <!-- extend / include -->
  <g stroke="#555" stroke-width="1.2" stroke-dasharray="6 4" fill="none">
    <line x1="592" y1="160" x2="527" y2="160" marker-end="url(#arr)"/>
    <line x1="600" y1="182" x2="512" y2="216" marker-end="url(#arr)"/>
    <line x1="592" y1="290" x2="527" y2="290" marker-end="url(#arr)"/>
    <line x1="526" y1="490" x2="590" y2="490" marker-end="url(#arr)"/>
    <path d="M525 624 C 820 660, 880 520, 812 302" marker-end="url(#arr)"/>
  </g>
  <g font-size="12" fill="#555">
    <text x="560" y="152" text-anchor="middle">«extend»</text>
    <text x="545" y="226">«extend»</text>
    <text x="560" y="282" text-anchor="middle">«extend»</text>
    <text x="558" y="482" text-anchor="middle">«include»</text>
    <text x="600" y="648">«include»</text>
  </g>
</svg>
